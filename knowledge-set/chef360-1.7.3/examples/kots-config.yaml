# -----------------------------------------------------------------------------
# kots-config.yaml — SCRUBBED EXAMPLE (placeholder) ONLY
# -----------------------------------------------------------------------------
# This file is a deliberately scrubbed example. It contains NO real secrets —
# every secret-bearing value has been replaced with a "<scrubbed: ...>" marker.
#
# Real values are NOT stored under this repository (git history is unforgiving).
# The authoritative real kots config lives OUTSIDE the repo:
#
#   Real config file   -> ~/.secrets/chef360-kots-config.yaml   (0600)
#   TLS leaf cert/key  -> ~/certs/<vm>_chef360-2.crt / .key     (key 0600)
#   TLS chain/ca       -> ~/certs/<vm>_chef360_chain.crt
#
# Install workflow (see WORKFLOW.md — this matches the canonical steps):
#   1. If the real ~/.secrets/chef360-kots-config.yaml exists (previous/new
#      project), the installer passes it via `--config-values` and Chef 360
#      auto-deploys; the operator then watches http://<VM_IP>:31101 (Mailpit)
#      for the admin activation email and follows the email instructions.
#   2. If the config file is ABSENT (fresh project, no kots-config yet), the
#      installer OMITS the --config-values argument and the operator instead:
#         a. browses to https://<VM_IP>:30000  (Admin Console) to configure
#            and deploy from the browser, then
#         b. watches http://<VM_IP>:31101      (Mailpit) for the admin
#            activation email and follows the instructions in the email.
#
# The non-secret defaults below (ports, nodeports, subdomains, tenant fields,
# flags) are kept because the plan/stable/cert scripts dereference them by key.
# =============================================================================
apiVersion: kots.io/v1beta1
kind: ConfigValues
metadata:
  name: chef-360
spec:
  values:
    api::gateway::cache::enabled:
      default: "1"
      value: "1"
    api::gateway::certificate::file:
      filename: chef360-2.crt
      value: "<scrubbed: base64 TLS leaf cert — real value in ~/certs>"
    api::gateway::chain::file:
      filename: chef360_chain.crt
      value: "<scrubbed: base64 TLS chain — real value in ~/certs>"
    api::gateway::hostname:
      default: chef360-1-7-3.demo.lab
      value: "<scrubbed: VM hostname — real value in ~/.secrets>"
    api::gateway::install::admin::token:
      default: ""
      value: "<scrubbed: admin token>"
    api::gateway::loglevel:
      default: info
      value: info
    api::gateway::nodeport::nginx:
      default: "31000"
      value: "31000"
    api::gateway::private::key::file:
      filename: chef360-2.key
      value: "<scrubbed: base64 TLS private key — real value in ~/certs>"
    api::gateway::root::cert::file:
      filename: chef360_chain.crt
      value: "<scrubbed: base64 root CA — real value in ~/certs>"
    api::gateway::static::auth::token:
      default: ""
      value: "<scrubbed: static auth token>"
    api::gateway::tls::certificate::file:
      filename: chef360-2.crt
      value: "<scrubbed: base64 TLS leaf cert — real value in ~/certs>"
    api::gateway::tls::private::key::file:
      filename: chef360-2.key
      value: "<scrubbed: base64 TLS private key — real value in ~/certs>"
    api::gateway::tls::root::ca::file:
      filename: chef360_chain.crt
      value: "<scrubbed: base64 TLS root CA — real value in ~/certs>"
    api::gateway::tls::tls::verify:
      default: "0"
      value: "0"
    api::keycloak::admin::console::password:
      value: "<scrubbed: Keycloak admin console password>"
    api::custom::ca::bundle: {}
    api::opensearch::password:
      value: "<scrubbed: opensearch admin password>"
    api::opensearch::username:
      value: "<scrubbed: opensearch username>"
    api::rabbitmq::password:
      value: "<scrubbed: rabbitmq password>"
    api::rabbitmq::username:
      value: "<scrubbed: rabbitmq username>"
    api::signing::ca::cert::secret::key: {}
    api::signing::key::secret: {}
    database::password:
      value: "<scrubbed: embedded-cluster database password>"
    database::username:
      value: "<scrubbed: embedded-cluster database username>"
    mailpit::http::nodeport:
      default: "31101"
      value: "31101"
    minio::access::key:
      value: "<scrubbed: minio access key>"
    minio::secret::key:
      value: "<scrubbed: minio secret key>"
    postgresql::cnpg::backup::s3::secret::key:
      value: "<scrubbed: cnpg backup S3 secret key>"
    smtp::auth::method:
      value: plain
    smtp::bcc: {}
    smtp::host:
      value: mailpit
    smtp::password:
      value: "<scrubbed: SMTP password — real value in ~/.secrets>"
    smtp::port:
      default: "2525"
      value: "2525"
    smtp::sender::email:
      value: "<scrubbed: SMTP sender email>"
    smtp::tls:
      default: "0"
      value: "0"
    smtp::username:
      value: "<scrubbed: SMTP username>"
    temporal::cloud::api::key:
      value: "<scrubbed: Temporal cloud API key>"
    tenant::admin::email:
      value: "<scrubbed: tenant admin email — real value in ~/.secrets>"
    tenant::admin::name::first:
      default: chef
      value: chef
    tenant::admin::name::last:
      default: admin
      value: admin
    tenant::admin::password:
      value: "<scrubbed: tenant admin password>"
    tenant::org::name:
      default: chef
      value: chef
    tenant::subdomain:
      default: chef360
      value: chef360
    tenant::tld:
      default: demo.lab
      value: demo.lab
    temporal::namespace: {}
    temporal::option:
      default: temporal::option::onprem
    topolvm::option:
      default: topolvm::option::disabled
status: {}
