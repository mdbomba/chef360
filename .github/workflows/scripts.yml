name: Script Verification

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash scripts/ci/check-scripts.sh
