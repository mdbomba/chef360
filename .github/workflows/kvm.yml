name: KVM Scripts

on:
  pull_request:
    paths:
      - 'scripts/kvm/**'
      - 'scripts/ci/check-kvm-scripts.sh'
      - '.github/workflows/kvm.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/kvm/**'
      - 'scripts/ci/check-kvm-scripts.sh'
      - '.github/workflows/kvm.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify KVM script syntax
        run: bash scripts/ci/check-kvm-scripts.sh