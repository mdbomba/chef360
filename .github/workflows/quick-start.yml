name: Quick Start

on:
  pull_request:
    paths:
      - 'docs/quick-start/**'
      - 'scripts/chef360/download-install-server.sh'
      - 'scripts/ci/check-quick-start.sh'
      - 'scripts/content/build-quick-start-pdf.py'
      - 'scripts/content/requirements-quick-start-pdf.txt'
      - '.github/workflows/quick-start.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/quick-start/**'
      - 'scripts/chef360/download-install-server.sh'
      - 'scripts/ci/check-quick-start.sh'
      - 'scripts/content/build-quick-start-pdf.py'
      - 'scripts/content/requirements-quick-start-pdf.txt'
      - '.github/workflows/quick-start.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify quick-start content
        run: bash scripts/ci/check-quick-start.sh

      - name: Check PDF builder syntax
        run: python3 -m py_compile scripts/content/build-quick-start-pdf.py
